<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crossfraud · Review console</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#152341;font:16px system-ui,sans-serif}header{background:#122348;color:white;padding:20px max(24px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:20px}header span{color:#d3e4ff;font-size:14px}main{max-width:1248px;margin:auto;padding:32px 24px}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.035em}.intro{margin-top:8px;color:#475774}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat,section{border:1px solid #dce5f4;background:white;border-radius:14px}.stat{padding:14px 18px;color:#475774}.stat strong{display:block;font-size:24px;color:#182f68}.layout{display:grid;grid-template-columns:minmax(235px,1fr) minmax(0,2fr);gap:18px;align-items:start}section{padding:20px}label{display:block;margin-bottom:8px}button,select{font:inherit;border-radius:8px;border:1px solid #cbd7ee;background:white;color:inherit;padding:9px 12px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #5378e6;outline-offset:2px}button:disabled{cursor:wait;opacity:.6}#queue{display:grid;gap:8px;margin-top:15px;max-height:580px;overflow:auto}.item{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}.item[aria-pressed=true]{background:#eaf0ff;border-color:#6d8be2}.item small,small,.muted{color:#526381}.badge{background:#f9e9ec;color:#922b40;padding:4px 8px;border-radius:20px;font-size:14px}.title{display:flex;justify-content:space-between;gap:10px;align-items:start}.detail{margin:18px 0;padding:15px;background:#f0f4ff;border-radius:10px}.detail h3{margin-bottom:8px}dl{display:grid;grid-template-columns:minmax(110px,1fr) 2fr;gap:8px;margin:0}dd{margin:0;overflow-wrap:anywhere}dt{color:#50617c}ol,ul{padding-left:22px}li{margin-bottom:6px}.actions{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin-top:18px}.primary{background:#284eb7;color:white;border-color:#284eb7}#status{margin-top:10px;min-height:24px}.history{margin-top:16px}a{color:#284eb7}.title p{margin-top:4px}@media(max-width:720px){.layout{grid-template-columns:1fr}#queue{max-height:220px}.stat{padding:11px}.stat span{font-size:14px}}
</style></head><body>
<header><strong>Crossfraud</strong><span>Local demo · Synthetic data</span></header>
<main><h1>Alert review</h1><p class="intro">Review messaging warnings and UPI payment alerts with their supporting evidence.</p>
<div class="stats" aria-label="Alert counts"><div class="stat"><strong id="total">–</strong><span>All alerts</span></div><div class="stat"><strong id="messages">–</strong><span>Messaging warnings</span></div><div class="stat"><strong id="payments">–</strong><span>Payment alerts</span></div></div>
<div class="layout"><section aria-label="Alert queue"><label for="filter">Filter alerts</label><select id="filter"><option value="">All alerts</option><option value="messaging_warning">Messaging warnings</option><option value="payment_time_review">Payment alerts</option></select><div id="queue"></div></section>
<section id="panel" aria-label="Alert details">Loading alerts…</section></div></main>
<script>
const byId = (id) => document.getElementById(id);
const safe = (value) => String(value ?? 'Unavailable').replace(/[&<>"']/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const time = (value) => value ? new Intl.DateTimeFormat('en-IN', {dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kolkata'}).format(new Date(value)) + ' IST' : 'Unavailable';
const amount = (value) => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(value);
const number = (value) => typeof value === 'number' ? value.toFixed(3) : 'Unavailable';
const label = (alert) => alert.kind === 'messaging_warning' ? 'Messaging warning' : 'Payment-time alert';
const phrase = (value) => String(value).replaceAll('_',' ');
const field = (key, value) => '<dt>' + safe(key) + '</dt><dd>' + safe(value) + '</dd>';
let alerts = [], selected, saving = false;
async function request(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error('Request failed (' + response.status + ')');
  return response.json();
}
function queue() {
  const shown = alerts.filter((alert) => !byId('filter').value || alert.kind === byId('filter').value);
  if (!shown.some((alert) => alert.alert_id === selected)) selected = shown[0]?.alert_id;
  byId('queue').replaceChildren(...shown.map((alert) => {
    const button = document.createElement('button');
    button.className = 'item'; button.type = 'button';
    button.setAttribute('aria-pressed', String(selected === alert.alert_id));
    button.innerHTML = '<span><strong>' + safe(alert.entity_id) + '</strong><br><small>' + label(alert) + '</small></span><small>' + safe(alert.review_outcome) + '</small>';
    button.onclick = () => { selected = alert.alert_id; queue(); detail(); };
    return button;
  }));
}
function detail() {
  const alert = alerts.find((entry) => entry.alert_id === selected);
  if (!alert) { byId('panel').textContent = 'No alerts match this filter.'; return; }
  const evidence = alert.evidence || {}, candidate = evidence.match?.selected;
  const timeline = [[evidence.conversation_observed_at_utc,'Messaging score available'],[candidate?.request_time_utc,'Payment request quoted'],[alert.event_time_utc,label(alert)]].filter(([stamp]) => stamp);
  const signals = candidate ? [...(candidate.support || []), ...(candidate.conflicts || [])] : (evidence.signals || []);
  byId('panel').innerHTML = '<div class="title"><div><h2>' + label(alert) + '</h2><p class="muted">' + safe(alert.entity_id) + '</p></div><span class="badge">' + safe(alert.risk_level) + ' risk</span></div>' +
    '<div class="detail"><h3>Evidence</h3><dl>' + field('Risk score',number(alert.risk_score)) +
    (alert.kind === 'payment_time_review' ? field('UPI amount',amount(evidence.amount_inr)) + field('Match status',phrase(evidence.match?.status ?? 'unavailable')) : field('Messages seen',evidence.message_count)) +
    (candidate ? field('Matched chat',candidate.conversation_id) + field('Match confidence',number(candidate.confidence)) + field('Request to payment',Math.round(candidate.delay_minutes) + ' minutes') : '') +
    '</dl>' + (signals.length ? '<ul>' + signals.map((signal) => '<li>' + safe(phrase(signal)) + '</li>').join('') + '</ul>' : '') + '</div>' +
    '<h3>Timeline</h3><ol>' + timeline.map(([stamp,title]) => '<li><strong>' + safe(title) + '</strong> <small>' + safe(time(stamp)) + '</small></li>').join('') + '</ol>' +
    '<p class="muted">A risk score is a signal for review. Confirm the evidence before drawing conclusions.</p>' +
    '<form id="review" class="actions"><div><label for="outcome">Review outcome</label><select id="outcome">' +
    ['unresolved','confirmed','dismissed'].map((option) => '<option value="' + option + '"' + (option === alert.review_outcome ? ' selected' : '') + '>' + option[0].toUpperCase() + option.slice(1) + '</option>').join('') +
    '</select></div><button class="primary" type="submit"' + (saving ? ' disabled' : '') + '>Save review</button></form><p id="status" role="status"></p>' +
    '<div class="history"><h3>Review history</h3>' + (alert.review_history.length ? '<ul>' + [...alert.review_history].reverse().map((row) => '<li>' + safe(row.outcome) + ' · ' + safe(time(row.recorded_at_utc)) + '</li>').join('') + '</ul>' : '<p class="muted">No decisions recorded.</p>') + '</div>';
  byId('review').onsubmit = async (event) => {
    event.preventDefault();
    if (saving) return;
    saving = true; event.submitter.disabled = true;
    try {
      const updated = await request('/alerts/' + encodeURIComponent(alert.alert_id) + '/review', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({outcome:byId('outcome').value})});
      alerts = alerts.map((entry) => entry.alert_id === updated.alert_id ? updated : entry);
      saving = false; queue(); detail();
      if (selected === updated.alert_id) byId('status').textContent = 'Review saved.';
    } catch (error) { saving = false; detail(); byId('status').textContent = 'Could not save the review. ' + error.message; }
  };
}
byId('filter').onchange = () => { queue(); detail(); };
request('/alerts').then((data) => {
  alerts = data.alerts;
  byId('total').textContent = alerts.length;
  byId('messages').textContent = alerts.filter((alert) => alert.kind === 'messaging_warning').length;
  byId('payments').textContent = alerts.filter((alert) => alert.kind === 'payment_time_review').length;
  selected = alerts.find((alert) => alert.review_history.length && alert.kind === 'payment_time_review')?.alert_id || alerts.find((alert) => alert.kind === 'payment_time_review')?.alert_id;
  queue(); detail();
}).catch((error) => { byId('panel').textContent = 'Could not load alerts. ' + error.message; });
</script></body></html>
